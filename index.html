<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт про Ксю</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <style>
    	body {
    		background-color: rgb(242, 221, 198);
    	}

        .header {
        	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: white;
            border-radius: 30px;
            margin: 35px 20px;
        }

        .menu {
            display: flex;
            list-style: none;
            gap: 20px;
            margin: 0;
            padding: 0;
            font-size: 30px;
        }

        .menu a {
            position: relative; 
            display: inline-block;
            text-decoration: none;
            color: white;
            font-family: 'Courier New', monospace;
            font-weight: 500;
            padding: 8px 16px;
            transition: all 0.4s ease; 
            border-radius: 30px;
            background: black;
        }

        .menu a:hover { 
            color: rgb(242, 221, 198); 
        }

        .menu a::after {
    		content: "";
    		position: absolute;
    		left: 16px;
    		bottom: 6px;
    		width: 0;                  
    		height: 2px;              
    		background-color: rgb(242, 221, 198); 
    		transition: width 0.3s ease;
		}


        .menu a:hover::after {
            width: calc(100% - 32px);
        }

        .logo img {
            height: 50px;
            width: auto;
            display: block;
            border-radius: 30px;
        }

        .container {
        	font-size: 16px;
        	color: black;
        	display: block;
        }

        .ksu {
        	height: 300px;
        	width: auto;
        	display: block;
        	border-radius: 12px;
        }

        .hero-card {
        	display: flex;
        	align-items: center;
        	gap: 40px;
        	background-color: #fffaf3;
        	padding: 40px;
        	box-shadow: 0 4px 15 px rgba(0, 0, 0, 1.0);
        	border-radius: 30px;
        	margin: 35px 20px;
        	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        	margin: 35px 20px;
        }

        .hero-text h1 {
        	margin-top: 0;
        	font-size: 34px;
        	color: #111111;
        }

        .hero-text p {
        	font-size: 18px;
        	line-height: 1.6;
        	color: #333333;
        }

        .tag {
        	display: inline-block;
        	margin-top: 10px;
        	background-color: black;
        	color: rgb(242, 221, 198);
        	padding: 9px 18 px;
        	border-radius: 30 px;
        	font-size: 19px;
        }

        .facts {
        	display: flex;
        	gap: 30px;
        	margin: 35px 20px;
        }

        .fact-card {
        	flex: 1;
        	background-color: #fffaf3;
        	padding: 25px;
        	border-radius: 25px;
        	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .fact-card h2 {
        	margin-top: 0;
        	font-size: 32px;
        	color: black;
        }

        .fact-card h3 {
        	font-size: 17px;
        	line-height: 1.6;
        	color: #333333;
        	margin-bottom: 0;
        }

                .footer {
            display: flex;
            justify-content: space-between;
            list-style: none;
            gap: 25px;
            margin: 15px 30px;
            padding: 15px 30px;
            font-size: 24px;
        }

        .footer a {
            text-decoration: none;            
            color: black;                       
            font-family: 'Courier New', monospace;
            transition: opacity 0.3s ease;
        }

        .footer a:hover {
            font-size: 25px; 
        }

    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="index.html"><img src="images/logo.png" alt="Логотип"></a>
        </div>
        <nav>
            <ul class="menu">
                <li><a href="about.html">История про Ксю</a></li>
                <li><a href="index.html">Главная</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
    	<section class="hero-card">
    		<div class="hero-photo">
    			<img src="images/ksu0.png" alt="Ксю" class="ksu"> 
    		</div>
    		<div class="hero-text">
    			<h1>Мурлык, я Ксюнька</h1>
    			<p>Я очень люблю спать на батарее и кушаньки делать!</p>
    			<span class="tag">Главная по спячке</span>
    		</div>
    	</section>

    	<section class="facts">
    		<div class="fact-card">
    			<h2>Характер</h2>
    			<h3>Мурлычка, уютная, любопытная и игривая</h3>
    		</div>
    		<div class="fact-card">
    			<h2>Любимое занятие</h2>
    			<h3>Спать на батарее</h3>
    		</div>
    	</section>
    </main>
    <footer>
    <ul class="footer">
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">История о Ксю</a></li>
    </ul>
    <center><p class="copyright">&copy; 2026 Сайт Ксюньки. Все права защищены лапками.</p></center>
</body>
</html>
